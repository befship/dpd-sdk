name: Generate DPD SDK

on:
  workflow_dispatch:
    inputs:
      force_fetch:
        description: "Re-download official OpenAPI (ignore cache)"
        type: boolean
        default: true
      create_pr:
        description: "Open a PR if generated code changed"
        type: boolean
        default: true
      spec_url:
        description: "Optional OpenAPI URL override"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.0
      - name: Generate
        env:
          FORCE_FETCH: ${{ inputs.force_fetch && '1' || '0' }}
          SPEC_URL: ${{ inputs.spec_url }}
        run: bash generate.sh
      - run: go mod tidy
      - run: go test ./... -count=1
      - id: diff
        run: |
          if git diff --quiet -- internal/generated go.mod go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: inputs.create_pr && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: regenerate DPD eServiss clients from official OpenAPI"
          title: "chore: regenerate DPD eServiss clients from official OpenAPI"
          body: |
            Automated regeneration from DPD eServiss OpenAPI.

            - Official OpenAPI JSON is **not** committed.
            - Review generated diffs carefully before merge.
          branch: chore/regenerate-dpdlv-sdk
          delete-branch: true
